# Proton Mail MCP server — example accounts configuration.
# Copy to ~/.config/proton-mcp/config.toml and fill in real values.
#
# `password` is the password GENERATED BY PROTON MAIL BRIDGE (shown in the
# Bridge GUI when you enable IMAP/SMTP for an account), NOT your Proton
# account password.

# Account 1
[[accounts]]
name = "personal"
username = "me@proton.me"
password = "REPLACE_WITH_BRIDGE_PASSWORD"
# host = "127.0.0.1"     # optional, defaults to 127.0.0.1
# port = 1143           # optional, defaults to 1143 (Proton Bridge IMAP)
# security = "starttls" # optional: "starttls" (default) | "ssl" | "plain"

# Account 2 — add as many as you need; names must be unique.
[[accounts]]
name = "work"
username = "work@protonmail.com"
password = "REPLACE_WITH_BRIDGE_PASSWORD"
# security = "starttls"  # Bridge v3 advertises STARTTLS on localhost